name: Build Node Images

on:
  push:
    paths:
      - 'images/**'
      - 'scripts/build-node-images.sh'
      - '.github/workflows/build-images.yml'
    branches: [main]
  pull_request:
    paths:
      - 'images/**'
      - 'scripts/build-node-images.sh'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    name: Build orchestra-node Images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        k8s_version: ["1.34.0", "1.35.0", "1.36.0", "1.37.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for Kubernetes v${{ matrix.k8s_version }}
        run: |
          docker build \
            --build-arg K8S_VERSION="${{ matrix.k8s_version }}" \
            --tag orchestra-node:${{ matrix.k8s_version }} \
            images/orchestra-node

