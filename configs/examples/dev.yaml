apiVersion: orchestra.io/v1alpha1
kind: Cluster
metadata:
  name: dev-cluster
  labels:
    environment: development
    tier: local
spec:
  kubernetes_version: v1.31.2
  nodes:
    control_plane:
      count: 1
      image: kindest/node:v1.31.2
      port_mappings:
        - container_port: 80
          host_port: 8080
          protocol: tcp
        - container_port: 443
          host_port: 8443
          protocol: tcp
    workers:
      count: 1
      image: kindest/node:v1.31.2
  network:
    mode: bridge
    cni: orchestranet
    service_proxy: orchestra
    pod_cidr: 10.244.0.0/16
    service_cidr: 10.96.0.0/12
    bridge_subnet: 172.30.0.0/16
    bridge_name: orch-br0
    api_server_port: 6443
  ebpf:
    enabled: true
    pin_path: /sys/fs/bpf/orchestra
    service_load_balancer: true
    conntrack: true
    programs:
      - xdp
      - tc
  runtime:
    image_pull_policy: IfNotPresent
    cgroup_driver: systemd
  observability:
    log_level: info
    log_format: pretty
    metrics_enabled: true
    metrics_port: 9090
  security:
    seccomp_profile: default
    privileged_nodes: true
    enable_mtls: false
