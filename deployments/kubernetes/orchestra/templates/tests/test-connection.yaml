apiVersion: v1
kind: Pod
metadata:
  name: {{ include "orchestra.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orchestra.labels" . | nindent 4 }}
    helm.sh/test: "true"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: grpc-health
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Testing gRPC connectivity to orchestrad..."
          nc -zv {{ include "orchestra.fullname" . }} {{ .Values.service.port }}
          echo "Connection successful!"

