apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: orchestranetworks.orchestra.io
spec:
  group: orchestra.io
  scope: Namespaced
  names:
    plural: orchestranetworks
    singular: orchestranetwork
    kind: OrchestraNetwork
    shortNames:
      - onet
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["clusterName", "podCIDR", "serviceCIDR"]
              properties:
                clusterName:
                  type: string
                podCIDR:
                  type: string
                serviceCIDR:
                  type: string
                gatewayAPI:
                  type: boolean
                kubeProxyReplacement:
                  type: boolean
            status:
              type: object
              properties:
                cniReady:
                  type: boolean
                ebpfProgramsLoaded:
                  type: integer
                netkitDevices:
                  type: integer
                serviceLBReady:
                  type: boolean
                gatewayReady:
                  type: boolean
      additionalPrinterColumns:
        - name: NAME
          type: string
          jsonPath: .metadata.name
        - name: CLUSTER
          type: string
          jsonPath: .spec.clusterName
        - name: CNI-READY
          type: boolean
          jsonPath: .status.cniReady
        - name: EBPF-PROGRAMS
          type: integer
          jsonPath: .status.ebpfProgramsLoaded
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
