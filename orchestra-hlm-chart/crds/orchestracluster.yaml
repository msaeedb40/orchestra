apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: orchestraclusters.orchestra.io
spec:
  group: orchestra.io
  scope: Namespaced
  names:
    plural: orchestraclusters
    singular: orchestracluster
    kind: OrchestraCluster
    shortNames:
      - oc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["name", "kubernetesVersion", "controlPlane"]
              properties:
                name:
                  type: string
                kubernetesVersion:
                  type: string
                  enum: ["v1.35", "v1.36", "v1.37"]
                podCIDR:
                  type: string
                serviceCIDR:
                  type: string
                controlPlane:
                  type: object
                  required: ["replicas"]
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                    endpoint:
                      type: string
                workers:
                  type: object
                  properties:
                    count:
                      type: integer
                      minimum: 0
                networking:
                  type: object
                  properties:
                    cni:
                      type: string
                    gatewayAPI:
                      type: boolean
                    kubeProxyReplacement:
                      type: boolean
                runtime:
                  type: object
                  properties:
                    containerdVersion:
                      type: string
                    runcVersion:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                kubernetesVersion:
                  type: string
                controlPlaneReady:
                  type: boolean
                readyNodes:
                  type: integer
                totalNodes:
                  type: integer
                apiEndpoint:
                  type: string
      additionalPrinterColumns:
        - name: NAME
          type: string
          jsonPath: .spec.name
        - name: VERSION
          type: string
          jsonPath: .spec.kubernetesVersion
        - name: PHASE
          type: string
          jsonPath: .status.phase
        - name: NODES
          type: integer
          jsonPath: .status.totalNodes
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
